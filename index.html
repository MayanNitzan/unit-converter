<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="hero">
      <h1 id="title">Metric/Imperial Unit Conversion</h1>
      <input id="input-el" placeholder="0" type="text" />
      <button id="btn-el">Convert</button>
    </div>
    <div id="values">
      <div class="the-values">
        <h2>Length (Meter/Feet)</h2>
        <h3 id="result-el-1">0 meters = 0 feet | 0 feet = 0 meters</h3>
      </div>
      <div class="the-values">
        <h2>Volume (Liters/Gallons)</h2>
        <h3 id="result-el-2">0 liters = 0 gallons | 0 gallons = 0 liters</h3>
      </div>
      <div class="the-values">
        <h2>Mass (Kilograms/Pounds)</h2>
        <h3 id="result-el-3">0 kilos = 0 pounds | 0 pounds = 0 kilos</h3>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
